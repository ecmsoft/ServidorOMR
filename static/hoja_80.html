<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Hoja de Respuestas — 80 Preguntas</title>
<style>
  @page { size: letter portrait; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 215.9mm;
    height: 279.4mm;
    font-family: Arial, Helvetica, sans-serif;
    background: white;
    color: black;
    overflow: hidden;
    position: relative;
  }

  /* ── Marcadores de esquina 8x8mm ── */
  .marker {
    position: absolute;
    width: 8mm;
    height: 8mm;
    background: black;
    z-index: 10;
  }
  .marker.tl { top: 5mm;  left: 5mm; }
  .marker.tr { top: 5mm;  right: 5mm; }
  .marker.bl { bottom: 5mm; left: 5mm; }
  .marker.br { bottom: 5mm; right: 5mm; }

  /* ── Encabezado ── */
  .header {
    position: absolute;
    top: 7mm;
    left: 18mm;
    right: 18mm;
  }
  .titulo {
    font-size: 11pt;
    font-weight: bold;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1.5px solid black;
    padding-bottom: 1.5mm;
    margin-bottom: 2mm;
  }
  .campos {
    display: flex;
    gap: 3mm;
    margin-bottom: 1.5mm;
  }
  .campo { flex: 1; }
  .campo.ch { flex: 0 0 30mm; }
  .campo-label {
    font-size: 5.5pt;
    font-weight: bold;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 1mm;
  }
  .campo-linea {
    border-bottom: 0.8px solid black;
    height: 4mm;
  }
  .instrucciones {
    font-size: 5.5pt;
    color: #555;
    border: 0.5px solid #aaa;
    padding: 1mm 2mm;
    border-radius: 0.8mm;
    margin-top: 1.5mm;
    line-height: 1.4;
  }

  /* ── Área preguntas: 4 columnas × 20 filas ── */
  .area {
    position: absolute;
    top: 46mm;
    left: 11mm;
    right: 11mm;
    bottom: 14mm;
    display: flex;
    gap: 3mm;
  }

  .columna {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* ── Cabecera de columna ── */
  .col-head {
    display: flex;
    align-items: center;
    border-bottom: 1px solid #333;
    padding-bottom: 1mm;
    margin-bottom: 1mm;
  }
  .col-head .nh {
    width: 6mm;
    font-size: 5pt;
    font-weight: bold;
    color: #555;
    text-align: center;
    flex-shrink: 0;
  }
  .col-head .oh {
    flex: 1;
    display: flex;
    justify-content: space-between;
    padding: 0 0.5mm;
  }
  .col-head .oh span {
    font-size: 6pt;
    font-weight: bold;
    width: 5mm;
    text-align: center;
  }

  /* ── Fila: burbuja 5mm + separación 3mm = 8mm ── */
  .fila {
    display: flex;
    align-items: center;
    height: 8mm;
    border-bottom: 0.3pt dotted #ddd;
  }
  .fila:nth-child(odd) { background: #f7f7f7; }

  .np {
    width: 6mm;
    font-size: 5.5pt;
    font-weight: bold;
    color: #444;
    text-align: right;
    padding-right: 1mm;
    flex-shrink: 0;
    line-height: 1;
  }

  /* Burbujas distribuidas con espacio entre ellas */
  .burbujas {
    flex: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 0.5mm;
  }

  /* Burbuja 5x5mm */
  .b {
    width: 5mm;
    height: 5mm;
    border-radius: 50%;
    border: 0.8pt solid #333;
    flex-shrink: 0;
  }

  /* ── Separador vertical ── */
  .sep {
    width: 0.5pt;
    background: #ccc;
    flex-shrink: 0;
  }

  /* ── Pie ── */
  .footer {
    position: absolute;
    bottom: 3.5mm;
    left: 18mm;
    right: 18mm;
    display: flex;
    justify-content: space-between;
    font-size: 5.5pt;
    color: #999;
    border-top: 0.5px solid #ccc;
    padding-top: 1mm;
  }

  @media print {
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="marker tl"></div>
<div class="marker tr"></div>
<div class="marker bl"></div>
<div class="marker br"></div>

<div class="header">
  <div class="titulo">Hoja de Respuestas — 80 Preguntas</div>
  <div class="campos">
    <div class="campo">
      <div class="campo-label">Nombre completo</div>
      <div class="campo-linea"></div>
    </div>
    <div class="campo ch">
      <div class="campo-label">Curso</div>
      <div class="campo-linea"></div>
    </div>
    <div class="campo ch">
      <div class="campo-label">Fecha</div>
      <div class="campo-linea"></div>
    </div>
  </div>
  <div class="instrucciones">
    ⚫ Rellene completamente el círculo &nbsp;|&nbsp;
    ✏️ Lápiz grafito N°2 &nbsp;|&nbsp;
    🚫 Una sola alternativa por pregunta &nbsp;|&nbsp;
    🔄 Borre completamente para corregir
  </div>
</div>

<div class="area">
  <div class="columna" id="col-1"></div>
  <div class="sep"></div>
  <div class="columna" id="col-2"></div>
  <div class="sep"></div>
  <div class="columna" id="col-3"></div>
  <div class="sep"></div>
  <div class="columna" id="col-4"></div>
</div>

<div class="footer">
  <span>Calco — Sistema de Corrección Automática</span>
  <span>80 preguntas · 5 alternativas (A – E)</span>
</div>

<script>
function buildCol(id, inicio, fin) {
  const col = document.getElementById(id);

  const head = document.createElement('div');
  head.className = 'col-head';
  head.innerHTML = `<div class="nh">N°</div>
    <div class="oh">
      <span>A</span><span>B</span><span>C</span><span>D</span><span>E</span>
    </div>`;
  col.appendChild(head);

  for (let q = inicio; q <= fin; q++) {
    const fila = document.createElement('div');
    fila.className = 'fila';
    fila.innerHTML = `
      <div class="np">${q}</div>
      <div class="burbujas">
        <div class="b"></div>
        <div class="b"></div>
        <div class="b"></div>
        <div class="b"></div>
        <div class="b"></div>
      </div>`;
    col.appendChild(fila);
  }
}

// 4 columnas × 20 preguntas
buildCol('col-1',  1, 20);
buildCol('col-2', 21, 40);
buildCol('col-3', 41, 60);
buildCol('col-4', 61, 80);
</script>
</body>
</html>
